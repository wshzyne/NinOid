

name: Build NinDroid APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o NinDroid-Android-Studio-Project.zip -d source

      - name: Locate Gradle project
        id: project
        run: |
          FILE=$(find source -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NinDroid-debug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
